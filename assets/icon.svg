<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="catGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9A56;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cat body -->
  <ellipse cx="64" cy="75" rx="35" ry="30" fill="url(#catGradient)" />
  
  <!-- Cat head -->
  <circle cx="64" cy="45" r="28" fill="url(#catGradient)" />
  
  <!-- Left ear -->
  <polygon points="40,25 48,5 56,28" fill="url(#catGradient)" />
  <polygon points="44,26 48,12 53,28" fill="#FFB380" />
  
  <!-- Right ear -->
  <polygon points="72,28 80,5 88,25" fill="url(#catGradient)" />
  <polygon points="75,28 80,12 84,26" fill="#FFB380" />
  
  <!-- Left eye -->
  <ellipse cx="52" cy="42" rx="6" ry="8" fill="white" />
  <ellipse cx="53" cy="43" rx="3" ry="4" fill="#333" />
  <circle cx="54" cy="41" r="1.5" fill="white" />
  
  <!-- Right eye -->
  <ellipse cx="76" cy="42" rx="6" ry="8" fill="white" />
  <ellipse cx="75" cy="43" rx="3" ry="4" fill="#333" />
  <circle cx="76" cy="41" r="1.5" fill="white" />
  
  <!-- Nose -->
  <ellipse cx="64" cy="52" rx="4" ry="3" fill="#FF9999" />
  
  <!-- Mouth -->
  <path d="M 60 55 Q 64 58 68 55" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round" />
  
  <!-- Whiskers left -->
  <line x1="35" y1="50" x2="48" y2="52" stroke="#333" stroke-width="1" stroke-linecap="round" />
  <line x1="35" y1="56" x2="48" y2="55" stroke="#333" stroke-width="1" stroke-linecap="round" />
  
  <!-- Whiskers right -->
  <line x1="80" y1="52" x2="93" y2="50" stroke="#333" stroke-width="1" stroke-linecap="round" />
  <line x1="80" y1="55" x2="93" y2="56" stroke="#333" stroke-width="1" stroke-linecap="round" />
  
  <!-- Tail -->
  <path d="M 95 70 Q 115 60 110 45 Q 105 35 115 30" stroke="url(#catGradient)" stroke-width="8" fill="none" stroke-linecap="round" />
</svg>